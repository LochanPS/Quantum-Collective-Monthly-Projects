name: Circuit Library Check

on:
  pull_request:
    paths:
      - "circuit-library/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for duplicate circuits
        run: python circuit-library/check_duplicates.py

      - name: Validate all circuit JSON files
        run: |
          python -c "
          import json, sys
          from pathlib import Path
          lib = Path('circuit-library')
          errors = []
          for f in lib.rglob('*.json'):
              if f.name in ('index.json',):
                  continue
              try:
                  with open(f) as fh:
                      json.load(fh)
              except Exception as e:
                  errors.append(f'{f}: {e}')
          if errors:
              for e in errors: print(e)
              sys.exit(1)
          print(f'All JSON files valid.')
          "
