[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qcsim"
version = "0.1.0"
description = "Quantum circuit simulator — Quantum Collective Monthly Project #1"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [{name = "Quantum Collective"}]
keywords = ["quantum", "simulator", "circuit", "qubits"]
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/LochanPS/Quantum-Collective-Monthly-Projects"
Repository = "https://github.com/LochanPS/Quantum-Collective-Monthly-Projects"
Documentation = "https://github.com/LochanPS/Quantum-Collective-Monthly-Projects/tree/main/2026-05-circuit-simulator/qcsim"
"Bug Tracker" = "https://github.com/LochanPS/Quantum-Collective-Monthly-Projects/issues"
Changelog = "https://github.com/LochanPS/Quantum-Collective-Monthly-Projects/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]
qiskit = ["qiskit>=1.0", "qiskit-aer>=0.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[project.scripts]
qcsim-interactive = "qcsim.tui:main"
qcsim-search = "qcsim.search_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["qcsim*"]
